<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tactical Holographic Telemetry Deck</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #01050d;
      font-family: 'Courier New', Courier, monospace;
      color: #00e5ff;
    }
    #viewport-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    #hud-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    /* Peripheral Tactical HUD */
    .hud-header {
      position: absolute;
      top: 16px;
      left: 20px;
      z-index: 10;
      pointer-events: auto;
      text-shadow: 0 0 8px rgba(0, 229, 255, 0.6);
    }
    .hud-title {
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #00e5ff;
    }
    .hud-sub {
      font-size: 11px;
      color: #70d8ff;
      margin-top: 3px;
      opacity: 0.85;
    }

    .hud-top-right {
      position: absolute;
      top: 16px;
      right: 20px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 12px;
      pointer-events: auto;
    }
    .hud-btn {
      background: rgba(14, 56, 102, 0.4);
      border: 1px solid #00e5ff;
      color: #00e5ff;
      padding: 6px 12px;
      font-family: inherit;
      font-size: 11px;
      cursor: pointer;
      border-radius: 2px;
      box-shadow: 0 0 10px rgba(0, 229, 255, 0.2);
      transition: all 0.2s;
    }
    .hud-btn:hover {
      background: rgba(0, 229, 255, 0.2);
      box-shadow: 0 0 14px rgba(0, 229, 255, 0.5);
    }

    .hud-bottom-left {
      position: absolute;
      bottom: 20px;
      left: 20px;
      z-index: 10;
      font-size: 11px;
      color: #70d8ff;
      background: rgba(1, 15, 30, 0.65);
      border: 1px solid rgba(0, 229, 255, 0.3);
      padding: 8px 12px;
      border-radius: 2px;
      pointer-events: auto;
      line-height: 1.5;
    }



    /* Celestial Hover Tooltip */
    #celestial-tooltip {
      display: none;
      position: absolute;
      z-index: 1000;
      pointer-events: none;
      background: rgba(1, 15, 30, 0.9);
      border: 1px solid #00e5ff;
      border-radius: 3px;
      padding: 8px 12px;
      font-size: 10px;
      color: #e0f7fa;
      line-height: 1.4;
      box-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
      white-space: nowrap;
    }

    /* Elevated Transit Route Inspection Panel */
    #transit-route-panel {
      display: none;
      position: absolute;
      bottom: 24px;
      right: 24px;
      width: 280px;
      background: rgba(1, 15, 30, 0.92);
      border: 1px solid #00e5ff;
      border-radius: 4px;
      padding: 14px;
      z-index: 200;
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.35);
      font-family: inherit;
    }
  </style>
</head>
<body>
  <div id="celestial-tooltip"></div>
  <div class="hud-header">
    <div class="hud-title">TACTICAL TELEMETRY DECK</div>
    <div class="hud-sub" id="radar-subtext">ANCHOR: YOKNEAM MAIN JCT (32.6595° N, 35.1090° E) | R: 10.0 KM</div>
  </div>

  <div class="hud-top-right">
    <div id="status-pill" style="font-size: 10px; color: #00e5ff; border: 1px solid #00e5ff; padding: 4px 8px; border-radius: 2px;">
      FEED: SIM + WS
    </div>
    <button class="hud-btn" id="open-settings-btn">SETTINGS [SYS]</button>
  </div>

  <div class="hud-bottom-left" id="telemetry-readout">
    <div>SURVEILLANCE: ACTIVE</div>
    <div id="target-count-readout">TARGETS: 8 ACTIVE (4 AIR / 4 GROUND)</div>
    <div id="camera-mode-readout">CAMERA: IDLE ROTATION (DRAG TO ROTATE)</div>
  </div>



  <div id="viewport-container"></div>
  <svg id="hud-overlay"></svg>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
