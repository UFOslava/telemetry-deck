<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tactical Holographic Telemetry Deck</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #01050d;
      font-family: 'Courier New', Courier, monospace;
      color: #00e5ff;
    }
    #viewport-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    #hud-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    /* Peripheral Tactical HUD */
    .hud-header {
      position: absolute;
      top: 16px;
      left: 20px;
      z-index: 10;
      pointer-events: auto;
      text-shadow: 0 0 8px rgba(0, 229, 255, 0.6);
    }
    .hud-title {
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #00e5ff;
    }
    .hud-sub {
      font-size: 11px;
      color: #70d8ff;
      margin-top: 3px;
      opacity: 0.85;
    }

    .hud-top-right {
      position: absolute;
      top: 16px;
      right: 20px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 12px;
      pointer-events: auto;
    }
    .hud-btn {
      background: rgba(14, 56, 102, 0.4);
      border: 1px solid #00e5ff;
      color: #00e5ff;
      padding: 6px 12px;
      font-family: inherit;
      font-size: 11px;
      cursor: pointer;
      border-radius: 2px;
      box-shadow: 0 0 10px rgba(0, 229, 255, 0.2);
      transition: all 0.2s;
    }
    .hud-btn:hover {
      background: rgba(0, 229, 255, 0.2);
      box-shadow: 0 0 14px rgba(0, 229, 255, 0.5);
    }

    .hud-bottom-left {
      position: absolute;
      bottom: 20px;
      left: 20px;
      z-index: 10;
      font-size: 11px;
      color: #70d8ff;
      background: rgba(1, 15, 30, 0.65);
      border: 1px solid rgba(0, 229, 255, 0.3);
      padding: 8px 12px;
      border-radius: 2px;
      pointer-events: auto;
      line-height: 1.5;
    }

    /* Settings Modal */
    #settings-modal {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 360px;
      background: #020916;
      border: 1px solid #00e5ff;
      box-shadow: 0 0 25px rgba(0, 229, 255, 0.35);
      padding: 20px;
      z-index: 100;
      color: #e0f7fa;
      border-radius: 4px;
    }
    #settings-modal.active {
      display: block;
    }
    .modal-title {
      font-size: 14px;
      font-weight: bold;
      color: #00e5ff;
      margin-bottom: 14px;
      letter-spacing: 1.5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-close {
      cursor: pointer;
      color: #ff6a00;
      font-size: 16px;
    }
    .form-group {
      margin-bottom: 12px;
    }
    .form-group label {
      display: block;
      font-size: 10px;
      color: #70d8ff;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .form-group input, .form-group select {
      width: 100%;
      background: rgba(14, 56, 102, 0.35);
      border: 1px solid rgba(0, 229, 255, 0.5);
      color: #00e5ff;
      padding: 6px 8px;
      font-family: inherit;
      font-size: 12px;
      outline: none;
    }
    .form-group input:focus {
      border-color: #00e5ff;
      box-shadow: 0 0 8px rgba(0, 229, 255, 0.4);
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 18px;
    }

    /* Celestial Hover Tooltip */
    #celestial-tooltip {
      display: none;
      position: absolute;
      z-index: 1000;
      pointer-events: none;
      background: rgba(1, 15, 30, 0.9);
      border: 1px solid #00e5ff;
      border-radius: 3px;
      padding: 8px 12px;
      font-size: 10px;
      color: #e0f7fa;
      line-height: 1.4;
      box-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
      white-space: nowrap;
    }

    /* Elevated Transit Route Inspection Panel */
    #transit-route-panel {
      display: none;
      position: absolute;
      bottom: 24px;
      right: 24px;
      width: 280px;
      background: rgba(1, 15, 30, 0.92);
      border: 1px solid #00e5ff;
      border-radius: 4px;
      padding: 14px;
      z-index: 200;
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.35);
      font-family: inherit;
    }
  </style>
</head>
<body>
  <div id="celestial-tooltip"></div>
  <div class="hud-header">
    <div class="hud-title">TACTICAL TELEMETRY DECK</div>
    <div class="hud-sub" id="radar-subtext">ANCHOR: YOKNEAM MAIN JCT (32.6595° N, 35.1090° E) | R: 10.0 KM</div>
  </div>

  <div class="hud-top-right">
    <div id="status-pill" style="font-size: 10px; color: #00e5ff; border: 1px solid #00e5ff; padding: 4px 8px; border-radius: 2px;">
      FEED: SIM + WS
    </div>
    <button class="hud-btn" id="open-settings-btn">SETTINGS [SYS]</button>
  </div>

  <div class="hud-bottom-left" id="telemetry-readout">
    <div>SURVEILLANCE: ACTIVE</div>
    <div id="target-count-readout">TARGETS: 8 ACTIVE (4 AIR / 4 GROUND)</div>
    <div id="camera-mode-readout">CAMERA: IDLE ROTATION (DRAG TO ROTATE)</div>
  </div>

  <!-- Settings Modal -->
  <div id="settings-modal">
    <div class="modal-title">
      <span>TACTICAL PARAMETERS</span>
      <span class="modal-close" id="close-settings-btn">&times;</span>
    </div>
    <div class="form-group">
      <label>Center Latitude (°N)</label>
      <input type="number" step="0.0001" id="cfg-lat" value="32.6595" />
    </div>
    <div class="form-group">
      <label>Center Longitude (°E)</label>
      <input type="number" step="0.0001" id="cfg-lon" value="35.1090" />
    </div>
    <div class="form-group">
      <label>Radar Radius (km)</label>
      <input type="number" step="1.0" id="cfg-radius" value="10.0" />
    </div>
    <div class="form-group">
      <label>Contour Interval (meters)</label>
      <select id="cfg-step">
        <option value="25" selected>25m (High Detail - Carmel Ridge)</option>
        <option value="50">50m (Medium Detail)</option>
        <option value="100">100m (Coarse Isolines)</option>
      </select>
    </div>
    <div class="form-group">
      <label>Contour Dimming / Opacity (<span id="val-contour-op">42%</span>)</label>
      <input type="range" id="cfg-contour-op" min="10" max="100" value="42" />
    </div>
    <div class="form-group">
      <label>Street & Road Color</label>
      <select id="cfg-road-color">
        <option value="0xffe600" selected>Electric Yellow (#ffe600)</option>
        <option value="0x00e5ff">Neon Cyan (#00e5ff)</option>
        <option value="0xff8f00">Tactical Amber (#ff8f00)</option>
        <option value="0xffffff">Ice White (#ffffff)</option>
      </select>
    </div>
    <div class="form-group">
      <label>Street Brightness / Opacity (<span id="val-road-op">95%</span>)</label>
      <input type="range" id="cfg-road-op" min="20" max="100" value="95" />
    </div>
    <div class="form-group">
      <label>Return to Idle Timeout (seconds)</label>
      <input type="number" step="5" id="cfg-idle-timeout" value="30" />
    </div>
    <div class="form-group">
      <label>Idle Rotation Speed</label>
      <select id="cfg-idle-speed">
        <option value="0.001">Subtle (0.001 rad/frame)</option>
        <option value="0.0015" selected>Standard (0.0015 rad/frame)</option>
        <option value="0.003">Dynamic (0.003 rad/frame)</option>
        <option value="0">Locked (No Rotation)</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="hud-btn" id="save-settings-btn">APPLY & REPROJECT</button>
    </div>
  </div>

  <div id="viewport-container"></div>
  <svg id="hud-overlay"></svg>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
