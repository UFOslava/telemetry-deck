services:
  backend:
    build:
      context: ./backend
    image: ghcr.io/ufoslava/telemetry-deck-backend:latest
    environment:
      - CENTER_LAT=32.0853
      - CENTER_LON=34.7818
      - RADIUS_KM=25.0
      - SETTINGS_FILE=/config/settings.json
      - TomTom_API_Key=${TomTom_API_Key:-}
    volumes:
      - ./config:/config
    ports:
      - "127.0.0.1:18000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    image: ghcr.io/ufoslava/telemetry-deck-frontend:latest
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
