name: Build and publish container images

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OWNER: ufoslava

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
          - name: frontend
            context: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/telemetry-deck-${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy main to era-server
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, era-server]
    timeout-minutes: 15
    concurrency:
      group: telemetry-deck-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Sync deployment files
        env:
          DEPLOY_DIR: /opt/stacks/telemetry-deck
        run: |
          set -euo pipefail
          install -d "$DEPLOY_DIR/config"
          install -m 0644 deploy/compose.yaml "$DEPLOY_DIR/compose.yaml"
          if [ ! -f "$DEPLOY_DIR/config/settings.json" ]; then
            install -m 0664 config/settings.json "$DEPLOY_DIR/config/settings.json"
          fi
          if [ ! -f "$DEPLOY_DIR/.env" ]; then
            install -m 0600 .env.example "$DEPLOY_DIR/.env"
            echo "::warning::Created $DEPLOY_DIR/.env from .env.example — set TomTom_API_Key on era-server."
          fi
      - name: Pull and recreate containers
        env:
          DEPLOY_DIR: /opt/stacks/telemetry-deck
        run: |
          set -euo pipefail
          cd "$DEPLOY_DIR"
          docker compose pull
          docker compose up -d --remove-orphans
          docker compose ps
      - name: Verify health
        env:
          DEPLOY_DIR: /opt/stacks/telemetry-deck
        run: |
          set -euo pipefail
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:5173/api/health >/dev/null; then
              echo "Deck healthy after $i checks."
              curl -fsS http://127.0.0.1:5173/api/health
              exit 0
            fi
            sleep 2
          done
          echo "::error::Deck did not become healthy on http://127.0.0.1:5173/api/health"
          cd "$DEPLOY_DIR" && docker compose logs --tail=100
          exit 1
